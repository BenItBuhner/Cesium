name: desktop-ci

on:
  workflow_dispatch:
  push:
    branches:
      - "cursor/**"
    paths:
      - "apps/desktop/**"
      - "apps/desktop-renderer/**"
      - "packages/**"
      - "server/src/**"
      - "server/package.json"
      - "scripts/prepare-desktop-*.mjs"
      - "scripts/prepare-desktop-*.cjs"
      - "scripts/generate-desktop-icons.mjs"
      - "scripts/generate-icons.mjs"
      - "scripts/desktop-icons.mjs"
      - "scripts/assert-desktop-*.cjs"
      - "scripts/assert-desktop-*.mjs"
      - "scripts/edit-desktop-exe-metadata.cjs"
      - "scripts/desktop-ci-capture-screen.ps1"
      - "scripts/desktop-ci-windows-install.ps1"
      - "public/desktop/**"
      - "public/icon-source.svg"
      - ".github/workflows/desktop-ci.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-macos:
    name: Package, smoke-test, and screenshot the macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: |
          npm ci
          # The server's file:.. dependency symlinks back to the repo root;
          # never let it into staged/packaged output.
          rm -f server/node_modules/cesium

      - name: Build shared workspace packages
        run: npm run build:packages

      - name: Package the macOS app (dmg + zip, arm64)
        run: npm --prefix apps/desktop run package:mac

      - name: List packaged output
        run: |
          ls -la apps/desktop/out
          ls -la "apps/desktop/out/mac-arm64/Cesium Desktop.app/Contents/Resources" | head -30

      - name: Assert the app icon is Cesium, not Electron's default
        run: |
          mkdir -p screenshots
          APP="apps/desktop/out/mac-arm64/Cesium Desktop.app"
          node scripts/assert-desktop-packaged-icons.mjs --mac-app "$APP"
          ICNS=$(find "$APP/Contents/Resources" -name '*.icns' -print)
          echo "$ICNS"
          test -n "$ICNS"
          ! echo "$ICNS" | grep -qi 'electron.icns'
          # Rasterize the bundled icns so the branded mark is visible without
          # a Finder/DMG screenshot (those can pick up runner permission sheets).
          sips -s format png "$ICNS" --out screenshots/macos_app_icon.png
          sips -g pixelWidth -g pixelHeight screenshots/macos_app_icon.png

      - name: Smoke-test the packaged app (embedded backend + window load)
        run: |
          APP_BIN="apps/desktop/out/mac-arm64/Cesium Desktop.app/Contents/MacOS/Cesium Desktop"
          "$APP_BIN" --smoke 2>&1 | tee smoke.log
          grep -q "Cesium packaged smoke passed" smoke.log

      - name: Launch the packaged app and capture its window
        # Window self-captures only - no `screencapture` here. The first
        # screencapture of the job triggers macOS 15's capture-approval
        # alert, which then lingers on screen; the full-screen install step
        # below must own the job's first (clean) screencapture.
        run: |
          mkdir -p screenshots
          APP_BIN="apps/desktop/out/mac-arm64/Cesium Desktop.app/Contents/MacOS/Cesium Desktop"
          OPENCURSOR_DESKTOP_CAPTURE_PATH="$PWD/screenshots/macos_app_window.png" \
            "$APP_BIN" > app.log 2>&1 &
          APP_PID=$!
          echo "Launched Cesium Desktop with PID $APP_PID"
          sleep 45
          kill "$APP_PID" || true
          sleep 3
          tail -50 app.log
          ls -la screenshots

      - name: Record scripted macOS demo (CDP-driven, window frame capture)
        run: |
          mkdir -p demo-frames
          APP="$PWD/apps/desktop/out/mac-arm64/Cesium Desktop.app"
          APP_BIN="$APP/Contents/MacOS/Cesium Desktop"
          printf '# macOS Demo\n\nShared into Cesium via the macOS Open With path.\n' > "$RUNNER_TEMP/cesium_demo_share.md"
          # Register the bundle with LaunchServices so `open -a` and the
          # cesium:// scheme resolve to this build.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$APP"
          OPENCURSOR_DESKTOP_CAPTURE_PATH="$PWD/demo-frames/frame.png" \
          OPENCURSOR_DESKTOP_CAPTURE_INTERVAL_MS=600 \
            "$APP_BIN" --remote-debugging-port=9222 > demo-app.log 2>&1 &
          APP_PID=$!
          echo "Launched Cesium Desktop for demo with PID $APP_PID"
          CESIUM_DEMO_SHARE_CMD="open -a \"$APP\" \"$RUNNER_TEMP/cesium_demo_share.md\"" \
          CESIUM_DEMO_DEEPLINK_CMD="open 'cesium://share?text=Hello%20from%20a%20cesium%20deep%20link%20on%20macOS'" \
            node scripts/desktop-demo-driver.mjs
          sleep 3
          kill "$APP_PID" || true
          sleep 2
          tail -30 demo-app.log
          echo "Captured $(ls demo-frames | wc -l) demo frames"

      - name: Install from the DMG and capture the full screen (traffic lights)
        run: |
          mkdir -p screenshots
          csrutil status || true
          # Suppress the macOS 15 legacy screen-capture re-approval alert so
          # it does not photobomb the captures (documented managed key; best
          # effort on an unmanaged runner).
          sudo defaults write /Library/Preferences/com.apple.applicationaccess forceBypassScreenCaptureAlert -bool true || true
          DMG=$(ls apps/desktop/out/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/CesiumDesktop
          ls -la /Volumes/CesiumDesktop
          sudo cp -R "/Volumes/CesiumDesktop/Cesium Desktop.app" /Applications/
          hdiutil detach /Volumes/CesiumDesktop
          xattr -dr com.apple.quarantine "/Applications/Cesium Desktop.app" || true
          open -a "/Applications/Cesium Desktop.app"
          # Let the workbench settle fully so the job's FIRST screencapture
          # (guaranteed alert-free) is the settled money shot.
          sleep 60
          screencapture -x screenshots/macos_fullscreen_installed_workbench.png || true
          sleep 10
          screencapture -x screenshots/macos_fullscreen_installed_extra1.png || true
          sleep 10
          screencapture -x screenshots/macos_fullscreen_installed_extra2.png || true
          APP_PID=$(pgrep -x "Cesium Desktop" | head -1)
          if [ -n "$APP_PID" ]; then kill "$APP_PID" || true; fi
          sleep 3
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/CesiumDesktop
          open /Volumes/CesiumDesktop
          sleep 4
          screencapture -x screenshots/macos_dmg_install_window.png || true
          hdiutil detach /Volumes/CesiumDesktop || true
          ls -la screenshots

      - name: Upload macOS demo frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesium-desktop-macos-demo-frames
          if-no-files-found: warn
          path: |
            demo-frames/
            demo-app.log

      - name: Upload macOS app artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesium-desktop-macos
          if-no-files-found: warn
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip

      - name: Upload macOS smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesium-desktop-macos-evidence
          if-no-files-found: warn
          path: |
            screenshots/
            smoke.log
            app.log

  package-windows:
    name: Package, smoke-test, and screenshot the Windows app
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: |
          npm ci
          # The server's file:.. dependency links back to the repo root;
          # never let it into staged/packaged output.
          rm -rf server/node_modules/cesium

      - name: Build shared workspace packages
        run: npm run build:packages

      - name: Package the Windows app (NSIS installer, x64)
        run: npm --prefix apps/desktop run package:win

      - name: List packaged output
        run: |
          ls -la apps/desktop/out
          ls -la apps/desktop/out/win-unpacked/resources | head -30

      - name: Assert installer and exe icons are Cesium, not Electron's default
        shell: bash
        run: |
          SETUP=$(ls apps/desktop/out/*[Ss]etup*.exe 2>/dev/null | head -1)
          if [ -z "$SETUP" ]; then
            SETUP=$(ls apps/desktop/out/*.exe | head -1)
          fi
          echo "Setup executable: $SETUP"
          node scripts/assert-desktop-packaged-icons.mjs \
            --ico apps/desktop/build/icon.ico \
            --win-unpacked apps/desktop/out/win-unpacked \
            --win-setup "$SETUP"
          echo "SETUP_PATH=$SETUP" >> "$GITHUB_ENV"

      - name: Run the one-click installer and capture branded UI
        shell: pwsh
        run: |
          # Git bash segfaults NSIS setup.exe; launch it with Start-Process.
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          & .\scripts\desktop-ci-windows-install.ps1 -SetupPath $env:SETUP_PATH -ScreenshotDir "$PWD/screenshots"

      - name: Launch the installed app and capture its window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          $env:OPENCURSOR_DESKTOP_CAPTURE_PATH = Join-Path $PWD "screenshots/windows_installed_app_window.png"
          Write-Host "Launching $($env:INSTALLED_EXE)"
          $proc = Start-Process -FilePath $env:INSTALLED_EXE -PassThru
          Start-Sleep -Seconds 45
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Get-Process -Name "Cesium","Cesium Desktop" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Get-ChildItem screenshots

      - name: Smoke-test the packaged app (embedded backend + window load)
        run: |
          "apps/desktop/out/win-unpacked/Cesium.exe" --smoke 2>&1 | tee smoke.log
          grep -q "Cesium packaged smoke passed" smoke.log

      - name: Launch the packaged app and capture its window
        run: |
          mkdir -p screenshots
          OPENCURSOR_DESKTOP_CAPTURE_PATH="$PWD/screenshots/windows_app_window.png" \
            "apps/desktop/out/win-unpacked/Cesium.exe" > app.log 2>&1 &
          APP_PID=$!
          echo "Launched Cesium Desktop with PID $APP_PID"
          sleep 45
          kill "$APP_PID" || true
          sleep 3
          tail -50 app.log
          ls -la screenshots

      - name: Upload Windows app artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesium-desktop-windows
          if-no-files-found: warn
          path: apps/desktop/out/*.exe

      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesium-desktop-windows-evidence
          if-no-files-found: warn
          path: |
            screenshots/
            smoke.log
            app.log
            installed-app.log

  package-linux:
    name: Package, smoke-test, and screenshot the Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure xvfb is available (preinstalled on GitHub Ubuntu images)
        run: |
          # apt-get update can hang for many minutes on busy runners waiting
          # for image maintenance locks; only fall back to apt when the
          # preinstalled xvfb-run is somehow missing.
          if ! command -v xvfb-run > /dev/null; then
            sudo timeout 300 apt-get update -q
            sudo timeout 300 apt-get install -y -q xvfb
          fi
          xvfb-run --help > /dev/null && echo "xvfb-run OK"

      - name: Install workspace dependencies
        run: |
          npm ci
          rm -f server/node_modules/cesium

      - name: Build shared workspace packages
        run: npm run build:packages

      - name: Package the Linux app (AppImage + deb, x64)
        # xvfb wraps the whole step because the desktop `check` script runs
        # `electron --version`, which needs an X display on Linux; the SUID
        # chrome-sandbox is not setuid-root on runners, so disable it.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum npm --prefix apps/desktop run package:linux

      - name: List packaged output
        run: |
          ls -la apps/desktop/out
          ls -la apps/desktop/out/linux-unpacked | head -20

      - name: Verify desktop-file integration (cesium:// scheme + mime types)
        run: |
          # Extract the AppImage without FUSE so we can inspect icons + .desktop.
          APPIMAGE=$(ls apps/desktop/out/*.AppImage | head -1)
          DEB=$(ls apps/desktop/out/*.deb | head -1)
          chmod +x "$APPIMAGE"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract > /dev/null
          cat squashfs-root/*.desktop
          grep -q "x-scheme-handler/cesium" squashfs-root/*.desktop
          grep -q "text/markdown" squashfs-root/*.desktop
          node scripts/assert-desktop-packaged-icons.mjs \
            --linux-appdir squashfs-root \
            --linux-deb "$DEB"
          echo "AppImage Icon=$(grep -E '^Icon=' squashfs-root/*.desktop)"

      - name: Smoke-test the AppImage under Xvfb (embedded backend, no window)
        env:
          OPENCURSOR_DESKTOP_DISABLE_GPU: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # Extract and run OUTSIDE the repo checkout: from inside it, Node's
          # upward module resolution can accidentally satisfy missing packaged
          # dependencies from the workspace node_modules and mask real bugs.
          APPIMAGE=$(ls apps/desktop/out/*.AppImage | head -1)
          SMOKE_DIR="$RUNNER_TEMP/cesium-appimage-smoke"
          mkdir -p "$SMOKE_DIR"
          (cd "$SMOKE_DIR" && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract > /dev/null)
          (cd "$SMOKE_DIR" && APPDIR="$SMOKE_DIR/squashfs-root" \
            xvfb-run --auto-servernum ./squashfs-root/AppRun --no-sandbox --disable-gpu --smoke 2>&1 | tee "$GITHUB_WORKSPACE/smoke.log")
          grep -q "Cesium packaged smoke passed" smoke.log

      - name: Launch the packaged app under Xvfb and capture its window
        continue-on-error: true
        env:
          OPENCURSOR_DESKTOP_DISABLE_GPU: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p screenshots
          OPENCURSOR_DESKTOP_CAPTURE_PATH="$PWD/screenshots/linux_app_window.png" \
            xvfb-run --auto-servernum apps/desktop/out/linux-unpacked/cesium-desktop \
            --no-sandbox --disable-gpu > app.log 2>&1 &
          RUNNER_PID=$!
          echo "Launched Cesium Desktop under Xvfb with PID $RUNNER_PID"
          sleep 45
          kill "$RUNNER_PID" || true
          sleep 3
          tail -50 app.log
          ls -la screenshots

      - name: Upload Linux app artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesium-desktop-linux
          if-no-files-found: warn
          path: |
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb

      - name: Upload Linux smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesium-desktop-linux-evidence
          if-no-files-found: warn
          path: |
            screenshots/
            smoke.log
            app.log
